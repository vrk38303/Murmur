name: PR Tests

# Runs unit tests on every PR. Cheap, ~6 min on a macOS runner.
# Free for public repos; private repos cost ~$0.16 of macOS minutes per run.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_16.app
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build & test
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme Murmur \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' | xcpretty
