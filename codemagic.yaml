# Codemagic CI/CD configuration for Murmur.
#
# WHY THIS EXISTS ALONGSIDE .github/workflows/testflight.yml
# ---------------------------------------------------------
# This repo already ships a working GitHub Actions pipeline that does the
# same job (build → sign via Fastlane Match → upload to TestFlight) on
# Apple's hosted macOS-15 runner. Either one works end-to-end from a
# Windows machine. Pick whichever is easier for *you* to provision:
#
#   GitHub Actions  → free macOS minutes for public repos, ~$0.16/min for
#                     private. Requires you to set up Match (one cloud-Mac
#                     session, ~$1, or via the one-shot workflow). The
#                     learning curve is "Apple's signing tooling" rather
#                     than "any specific CI vendor."
#
#   Codemagic       → free 500 build-minutes/month on M2 macs for solo
#                     devs (current pricing as of May 2026). Has built-in
#                     "Code signing identities" UI: you upload your .p12
#                     and provisioning profile through their dashboard
#                     and they fetch them onto the runner for you. No
#                     Fastlane Match required, but you DO still need to
#                     have generated those signing artefacts once on a
#                     Mac (or via Apple's web portal for the .p12 export).
#                     Their "Automatic code signing" mode goes further
#                     and creates the cert + profile for you using your
#                     App Store Connect API key — true zero-Mac path.
#
# RECOMMENDED FOR THIS PROJECT:
#   Solo developer on Windows, never touched Xcode signing → Codemagic
#   Already comfortable with GitHub Actions / Fastlane → stay on Actions
#
# Both pipelines are self-contained; you can wire one and ignore the
# other. Triggering Codemagic on the same `v*.*.*` tag pattern would
# upload twice; gate one of the two off (set the trigger to `pull_request`
# only, or comment out one of the workflow files) once you commit.
#
# ENVIRONMENT VARIABLES YOU MUST CONFIGURE IN CODEMAGIC
# -----------------------------------------------------
# Settings → Environment variables → "Add variable group" called `appstore`:
#
#   APP_STORE_CONNECT_ISSUER_ID    (UUID from App Store Connect → Keys)
#   APP_STORE_CONNECT_KEY_IDENTIFIER  (10-char Key ID)
#   APP_STORE_CONNECT_PRIVATE_KEY  (paste the entire .p8 file contents)
#   CERTIFICATE_PRIVATE_KEY        (passphrase you used when exporting the
#                                   .p12; only needed in MANUAL signing
#                                   mode — leave empty if using AUTOMATIC)
#   PROVISIONING_PROFILE           (only needed in MANUAL mode — paste the
#                                   base64 of your .mobileprovision)
#
# Mark the group as "Secret" so the values aren't printed in build logs.

workflows:
  ios-testflight:
    name: iOS — TestFlight
    # Mac mini M2 / Xcode 16. As of May 2026 this is the default
    # "macos-xcode-16.0" image. Bump the tag when Apple ships Xcode 17
    # GA and you want SpeechAnalyzer + FoundationModels on iOS 26.
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      # Codemagic's first-party App Store Connect integration. Wires the
      # API key for both "Automatic code signing" (below) and the
      # `app_store_connect` publishing step. Set this up under
      # Teams → Integrations → Developer Portal.
      app_store_connect: Murmur App Store Connect

    environment:
      groups:
        - appstore             # see header for required variables
      vars:
        BUNDLE_ID: "app.murmur.Murmur"
        XCODE_SCHEME: "Murmur"
        XCODE_WORKSPACE: ""    # we use xcodeproj generated by xcodegen
        XCODE_PROJECT: "Murmur.xcodeproj"
      xcode: 16.0
      cocoapods: default
      node: latest

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*.*.*'
          include: true
      cancel_previous_builds: true

    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Generate Xcode project from project.yml
        script: |
          xcodegen generate

      - name: Set up Apple App Store Connect API key
        # Codemagic's `app-store-connect` CLI consumes the env vars
        # populated from the `appstore` group above. This is the
        # zero-Mac path: Codemagic uses your API key to mint the
        # distribution cert + provisioning profile on the runner,
        # cached for subsequent builds.
        script: |
          app-store-connect fetch-signing-files \
            "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Add signing certificates to keychain
        script: |
          keychain initialize
          keychain add-certificates

      - name: Set provisioning profile on Xcode project
        script: |
          xcode-project use-profiles

      - name: Auto-bump build number from TestFlight
        # Pull the highest build number Apple has seen for this app and
        # set Info.plist's CFBundleVersion to one higher. We edit the
        # Info.plist directly with PlistBuddy instead of `agvtool` because
        # XcodeGen bakes a literal CFBundleVersion into the plist
        # rather than the $(CURRENT_PROJECT_VERSION) variable agvtool
        # would target.
        #
        # This is what avoids the "build number must be greater than
        # the previously uploaded version" rejection without manually
        # editing project.yml on every release.
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number \
            "$BUNDLE_ID" 2>/dev/null || echo "0")
          NEXT=$((LATEST + 1))
          echo "Setting build number to $NEXT (was $LATEST on TestFlight)"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $NEXT" \
            Murmur/Resources/Info.plist

      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags="-destination 'generic/platform=iOS'"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        # Use the same API key as `fetch-signing-files`. The key must
        # have at least App Manager role to upload builds.
        auth: integration

        # `false` → Codemagic returns immediately after upload; Apple
        # processes the build asynchronously (typically 5-15 min) and
        # emails you when it's ready in TestFlight. Setting this to
        # `true` makes the workflow wait for "Ready to Test" status,
        # which costs build minutes you don't need to pay for.
        submit_to_testflight: true
        beta_groups:
          - "Internal"

        # We do NOT auto-submit to App Review. That's a deliberate human
        # decision: open App Store Connect, attach screenshots and
        # release notes, then click "Submit for Review" yourself.
        submit_to_app_store: false

      email:
        # Quick "build done" notification while you're learning the
        # pipeline. Swap to Slack/Discord later once the cadence is
        # routine.
        recipients:
          - vrkalavapalli@gmail.com
        notify:
          success: true
          failure: true

  ios-pr-tests:
    name: iOS — PR tests
    instance_type: mac_mini_m2
    max_build_duration: 30

    environment:
      xcode: 16.0

    triggering:
      events:
        - pull_request
      branch_patterns:
        - pattern: 'main'
          include: true
      cancel_previous_builds: true

    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate project
        script: xcodegen generate
      - name: Run unit tests
        script: |
          set -o pipefail
          xcodebuild test \
            -scheme Murmur \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -resultBundlePath TestResults.xcresult | xcpretty || exit 1

    artifacts:
      - TestResults.xcresult
